
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanciones</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header class="encabezado">
        <h1>Gestión de sanciones</h1>
    </header>

    <nav class="menu">
        <a href="inicio.html">Inicio</a>
        <a href="equipos.html">Equipos</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="prestamos.html">Préstamos</a>
        <a href="sanciones.html" class="activo">Sanciones</a>
        <a href="login.html">Salir</a>
    </nav>

    <main class="contenedor">

        <section class="panel">
            <h2>Consultar sanciones</h2>

            <form id="formBuscarSancion">
                <label for="documentoSancion">
                    Documento del usuario
                </label>

                <input type="text" id="documentoSancion" required>

                <button type="submit" class="boton">
                    Buscar sanciones
                </button>
            </form>
        </section>

        <section class="panel">
            <h2>Listado de sanciones</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Motivo</th>
                            <th>Fecha de inicio</th>
                            <th>Fecha de finalización</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td colspan="5" class="vacio">
                                No hay sanciones registradas todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="../js/app.js"></script>
</body>
</html>
