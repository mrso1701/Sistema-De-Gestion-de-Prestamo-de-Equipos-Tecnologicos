
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header class="encabezado-login">
        <img src="../fotos/udc.png" alt="Logo universidad" class="logo">
        <h1>Sistema de préstamo de equipos</h1>
    </header>

    <main class="contenedor">

        <section class="tarjeta-login">

            <h2>Registro de usuario</h2>

            <form id="formRegistrarUsuario">

                <label for="regCodigo">Código institucional</label>
                <input type="text" id="regCodigo" required>

                <label for="regDocumento">Documento de identidad</label>
                <input type="text" id="regDocumento" required>

                <label for="regNombre">Nombre</label>
                <input type="text" id="regNombre" required>

                <label for="regApellido">Apellido</label>
                <input type="text" id="regApellido" required>

                <label for="regCorreo">Correo institucional</label>
                <input type="email" id="regCorreo" required>

                <label for="regTelefono">Teléfono</label>
                <input type="tel" id="regTelefono" required>

                <label for="regTipo">Tipo de usuario</label>
                <select id="regTipo" required>
                    <option value="MONITOR_BIBLIOTECA">
                        Monitor de biblioteca
                    </option>

                    <option value="COORDINADOR_BIBLIOTECA">
                        Coordinador de biblioteca
                    </option>
                </select>

                <label for="regContrasena">Contraseña</label>
                <input type="password" id="regContrasena"
                       minlength="8" required>

                <label for="regConfirmarContrasena">
                    Confirmar contraseña
                </label>
                <input type="password" id="regConfirmarContrasena"
                       minlength="8" required>

                <button type="submit" class="boton">
                    Registrarse
                </button>

            </form>

            <p class="nota">
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión aquí</a>
            </p>

        </section>

    </main>

    <script src="../js/app.js"></script>

</body>
</html>
