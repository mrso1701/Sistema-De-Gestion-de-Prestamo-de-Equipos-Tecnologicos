<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header class="encabezado">
        <h1>Gestión de usuarios</h1>
    </header>

    <nav class="menu">
        <a href="inicio.html">Inicio</a>
        <a href="equipos.html">Equipos</a>
        <a href="usuarios.html" class="activo">Usuarios</a>
        <a href="prestamos.html">Préstamos</a>
        <a href="sanciones.html">Sanciones</a>
        <a href="login.html">Salir</a>
    </nav>

    <main class="contenedor">

        <section class="panel">
            <h2>Registrar usuario</h2>

            <form id="formRegistrarUsuario">
                <label for="regCodigo">Código institucional (ID Universitario)</label>
                <input type="text" id="regCodigo" required>

                <label for="regDocumento">Documento de identidad</label>
                <input type="text" id="regDocumento" required>

                <label for="regNombre">Nombre</label>
                <input type="text" id="regNombre" required>

                <label for="regApellido">Apellido</label>
                <input type="text" id="regApellido" required>

                <label for="regCorreo">Correo institucional</label>
                <input type="email" id="regCorreo" required>

                <label for="regTelefono">Teléfono</label>
                <input type="text" id="regTelefono" required>

                <label for="regTipo">Tipo de usuario</label>
                <select id="regTipo" required>
                    <option value="ESTUDIANTE">Estudiante</option>
                    <option value="DOCENTE">Docente</option>
                    <option value="ADMINISTRATIVO">Administrativo</option>
                </select>

                <button type="submit" class="boton">
                    Registrar usuario
                </button>
            </form>
        </section>

    </main>

    <script src="../js/app.js"></script>
</body>

</html>
