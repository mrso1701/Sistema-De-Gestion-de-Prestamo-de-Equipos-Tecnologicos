
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header class="encabezado">
        <h1>Gestión de usuarios</h1>
    </header>

    <nav class="menu">
        <a href="inicio.html">Inicio</a>
        <a href="equipos.html">Equipos</a>
        <a href="usuarios.html" class="activo">Usuarios</a>
        <a href="prestamos.html">Préstamos</a>
        <a href="sanciones.html">Sanciones</a>
        <a href="login.html">Salir</a>
    </nav>

    <main class="contenedor">

        <section class="panel">
            <h2>Consultar usuario</h2>

            <form id="formBuscarUsuario">
                <label for="documento">Documento de identidad</label>
                <input type="text" id="documento" required>

                <button type="submit" class="boton">
                    Buscar usuario
                </button>
            </form>

            <p id="resultadoUsuario" class="nota">
                Ingrese un documento para consultar.
            </p>
        </section>

        <section class="panel">
            <h2>Usuarios registrados</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Documento</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Tipo de usuario</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td colspan="5" class="vacio">
                                No hay usuarios registrados todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="../js/app.js"></script>
</body>
</html>
